<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15203B" />
    <title>Flash du jour</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 8'><path fill='%23D1336B' d='M2 0h1v1H2zM8 0h1v1H8zM3 1h1v1H3zM7 1h1v1H7zM2 2h7v1H2zM1 3h2v1H1zM4 3h3v1H4zM8 3h2v1H8zM0 4h11v1H0zM0 5h1v2H0zM2 5h7v1H2zM10 5h1v2h-1zM2 6h1v1H2zM8 6h1v1H8zM3 7h2v1H3zM6 7h2v1H6z'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=Silkscreen&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <aside class="panel" id="panel" aria-label="Flashs du jour">
        <button class="grab" id="grab" type="button" aria-expanded="true" aria-controls="panel-body">
          <span class="grab-bar" aria-hidden="true"></span>
          <span class="sr-only">Replier ou déplier le panneau</span>
        </button>

        <header class="head">
          <div class="brand">
            <span class="tag">FLASH DU JOUR</span>
            <span class="player" id="player">Chargement…</span>
          </div>
          <button class="refresh" id="refresh" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 6.2A5.8 5.8 0 1 0 13.8 9h-1.9a4 4 0 1 1-.6-3.7L9.5 7H14V2.5l-1.5 1.5z" /></svg>
            <span>Rafraîchir</span>
          </button>
        </header>

        <div class="panel-body" id="panel-body">
          <div class="day">
            <label for="day" class="sr-only">Jour affiché</label>
            <button type="button" class="day-step" id="prev-day" aria-label="Jour précédent">◀</button>
            <input type="date" id="day" />
            <button type="button" class="day-step" id="next-day" aria-label="Jour suivant">▶</button>
          </div>

          <div class="stats">
            <div><strong id="stat-count">–</strong><span>invaders</span></div>
            <div><strong id="stat-points">–</strong><span>points</span></div>
            <div><strong id="stat-span">–</strong><span>de chasse</span></div>
          </div>

          <p class="status" id="status" role="status" aria-live="polite"></p>

          <ol class="flashes" id="flashes"></ol>

          <fieldset class="filters">
            <legend class="tag">SUR LA CARTE</legend>
            <label><input type="checkbox" id="f-day" checked /><i class="sw sw-day"></i>Flashés ce jour</label>
            <label><input type="checkbox" id="f-todo" checked /><i class="sw sw-todo"></i>À flasher</label>
            <label><input type="checkbox" id="f-done" checked /><i class="sw sw-done"></i>Déjà flashés</label>
            <label><input type="checkbox" id="f-gone" /><i class="sw sw-gone"></i>Détruits ou masqués</label>
          </fieldset>

          <p class="credits">
            Scans : API FlashInvaders. Positions volontairement approximatives :
            <a href="https://pnote.eu/projects/invaders/" target="_blank" rel="noopener">pnote.eu</a> / Invader Spotter.
          </p>
        </div>
      </aside>

      <main class="map-shell">
        <div id="map" aria-label="Carte des invaders"></div>
        <button class="locate" id="locate" type="button" aria-label="Me localiser">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.5A2.5 2.5 0 1 0 8 10.5 2.5 2.5 0 1 0 8 5.5zM8.75 1v1.8a5.25 5.25 0 0 1 4.45 4.45H15v1.5h-1.8a5.25 5.25 0 0 1-4.45 4.45V15h-1.5v-1.8A5.25 5.25 0 0 1 2.8 8.75H1v-1.5h1.8A5.25 5.25 0 0 1 7.25 2.8V1zM8 4.25a3.75 3.75 0 1 0 0 7.5 3.75 3.75 0 0 0 0-7.5z" /></svg>
        </button>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
